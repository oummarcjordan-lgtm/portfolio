<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K-Dreams — Sélection</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="icone-couronne-512.png">
<link rel="apple-touch-icon" href="icone-couronne-512.png">
<style>
  body {
    margin: 0;
    background: #0D0D0D;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  .screen {
    width: 100%;
    max-width: 380px;
  }
  .header {
    text-align: center;
    margin-bottom: 28px;
  }
  .logo {
    color: #D4AF37;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: 1px;
  }
  .slogan {
    color: #8a8a85;
    font-size: 13px;
    margin-top: 4px;
  }
  .list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .card {
    background: #152A20;
    border: 1px solid #D4AF37;
    border-radius: 12px;
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    text-decoration: none;
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  .card:active {
    transform: scale(0.98);
  }
  .icon {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    color: #D4AF37;
  }
  .icon svg {
    width: 100%;
    height: 100%;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .label {
    color: #F1EFE8;
    font-size: 16px;
    font-weight: 500;
    flex: 1;
  }
  .chevron {
    color: #D4AF37;
    font-size: 18px;
  }
  .badge {
    background: #A32D2D;
    color: #FCEBEB;
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 20px;
    white-space: nowrap;
  }

  /* Fond d'espace */
  body{--bgimg:url('bg-accueil.jpg');}
  body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(rgba(0,0,0,0.45),rgba(0,0,0,0.75)),var(--bgimg) center/cover no-repeat;}
  .brand{display:block;width:170px;max-width:60%;height:auto;margin:0 auto;}
</style>
</head>
<body>
  <div class="screen">
    <div class="header">
      <img class="brand" src="logo-k-dreams.png" alt="K-Dreams — Drink · Eat · Rest">
    </div>
    <div class="list">
      <a class="card" href="restaurant-rooftop.html">
        <span class="icon"><svg viewBox="0 0 24 24"><path d="M3 21h18"/><path d="M6 21V9l6-4 6 4v12"/><path d="M9 21v-6h6v6"/><path d="M9 12h.01"/><path d="M15 12h.01"/></svg></span>
        <span class="label">Restaurant &amp; Rooftop</span>
        <span class="chevron">›</span>
      </a>
      <a class="card" href="salle-de-jeu.html">
        <span class="icon"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><circle cx="8.5" cy="8.5" r="0.8" fill="currentColor" stroke="none"/><circle cx="15.5" cy="8.5" r="0.8" fill="currentColor" stroke="none"/><circle cx="8.5" cy="15.5" r="0.8" fill="currentColor" stroke="none"/><circle cx="15.5" cy="15.5" r="0.8" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="0.8" fill="currentColor" stroke="none"/></svg></span>
        <span class="label">Salle de jeu</span>
        <span class="chevron">›</span>
      </a>
      <a class="card" href="espace-cigare.html">
        <span class="icon"><svg viewBox="0 0 24 24"><path d="M2 15h14a2 2 0 0 0 0-4H2"/><path d="M2 13v2"/><path d="M16 12h4"/><path d="M18 9c1 1 1 3 0 4"/><path d="M20 9c1.3 1.3 1.3 4.3 0 5.6"/></svg></span>
        <span class="label">Espace cigare</span>
        <span class="chevron">›</span>
      </a>
      <a class="card" href="boite-de-nuit.html">
        <span class="icon"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span>
        <span class="label">Boîte de nuit</span>
        <span class="badge">ce soir</span>
      </a>
      <a class="card" href="hebergement.html">
        <span class="icon"><svg viewBox="0 0 24 24"><path d="M3 18v-7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v7"/><path d="M3 18h18"/><path d="M3 11V7a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v4"/></svg></span>
        <span class="label">Hébergement</span>
        <span class="chevron">›</span>
      </a>
    </div>
  </div>
</body>
</html>
