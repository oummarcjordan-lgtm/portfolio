<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>K-Dreams — Espace cigare</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="icone-couronne-512.png">
<link rel="apple-touch-icon" href="icone-couronne-512.png">
<style>
  :root{
    --bg:#0D0D0D; --gold:#D4AF37; --card:#152A20; --text:#F1EFE8;
    --muted:#8a8a85; --danger:#A32D2D; --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-top:var(--safe-t);padding-bottom:var(--safe-b);}
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:520px;margin:0 auto;padding:16px 16px 100px;}
  header{display:flex;align-items:center;gap:12px;padding:8px 0 18px;}
  .back{width:34px;height:34px;border:1px solid var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--gold);flex-shrink:0;}
  .htitle{flex:1;}
  .htitle .logo{color:var(--gold);font-weight:700;font-size:19px;letter-spacing:.5px;}
  .htitle .sub{color:var(--muted);font-size:12px;margin-top:2px;}
  .tabs{display:flex;gap:8px;margin-bottom:18px;}
  .tab{flex:1;text-align:center;padding:10px;border-radius:10px;border:1px solid var(--gold);color:var(--gold);font-size:14px;font-weight:600;cursor:pointer;background:transparent;}
  .tab.active{background:var(--gold);color:#0D0D0D;}
  .catnote{color:var(--muted);font-size:12px;margin:-6px 0 10px 2px;font-style:italic;}
  h2.cat{color:var(--gold);font-size:15px;font-weight:700;letter-spacing:.3px;margin:26px 0 10px;padding-bottom:6px;border-bottom:1px solid #2a2a26;}
  .item{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid #1c1c19;}
  .item .info{flex:1;min-width:0;}
  .item .nom{font-size:15px;font-weight:500;color:var(--text);}
  .item .ing{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4;}
  .item .prix{font-size:13px;color:var(--gold);margin-top:4px;font-weight:600;}
  .item .prix.na{color:var(--muted);font-style:italic;font-weight:400;}
  .qty{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .qty button{width:28px;height:28px;border-radius:8px;border:1px solid var(--gold);background:transparent;color:var(--gold);font-size:16px;line-height:1;cursor:pointer;}
  .qty button.plus{background:var(--gold);color:#0D0D0D;}
  .qty span{min-width:16px;text-align:center;font-size:14px;}
  .cartbtn{position:fixed;right:16px;bottom:calc(18px + var(--safe-b));background:var(--gold);color:#0D0D0D;border-radius:30px;padding:14px 20px;font-weight:700;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.5);display:none;align-items:center;gap:8px;cursor:pointer;z-index:20;border:none;}
  .cartbtn.show{display:inline-flex;}
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:30;}
  .sheet-bg.show{display:block;}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:#111310;border-top:1px solid var(--gold);border-radius:18px 18px 0 0;max-height:80vh;overflow-y:auto;padding:18px 18px calc(18px + var(--safe-b));z-index:31;transform:translateY(100%);transition:transform .25s ease;}
  .sheet.show{transform:translateY(0);}
  .sheet h3{color:var(--gold);margin:0 0 14px;font-size:16px;}
  .cline{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #1c1c19;gap:10px;}
  .cline .cn{font-size:14px;flex:1;}
  .cline .cp{font-size:13px;color:var(--gold);}
  .rm{color:var(--danger);font-size:12px;background:none;border:none;cursor:pointer;}
  .total{display:flex;justify-content:space-between;padding:16px 0 6px;font-size:16px;font-weight:700;color:var(--gold);}
  .paybtn{display:block;width:100%;padding:14px;border-radius:12px;border:1px solid var(--gold);background:transparent;color:var(--text);font-size:15px;font-weight:600;margin-top:10px;cursor:pointer;}
  .paybtn.gold{background:var(--gold);color:#0D0D0D;border:none;}
  .empty{color:var(--muted);text-align:center;padding:30px 0;}
  .confirm{text-align:center;padding:20px 0;}
  .cust{display:flex;flex-direction:column;gap:8px;margin:12px 0 4px;}
  .cust input{width:100%;padding:12px;border-radius:10px;border:1px solid #2f3a33;background:#0D0D0D;color:var(--text);font-size:15px;}
  .cust input:focus{outline:none;border-color:var(--gold);}
  .cerr{color:#e06b6b;font-size:12px;min-height:16px;margin:2px 0 0 2px;}
  .confirm .big{color:var(--gold);font-size:17px;font-weight:700;margin-bottom:6px;}

  /* Fond d'espace */
  body{--bgimg:url('bg-cigare.jpg');}
  body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(rgba(0,0,0,0.7),rgba(0,0,0,0.84)),var(--bgimg) center/cover no-repeat;}
  .htitle .logo-img{display:block;height:34px;width:auto;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="index.html">&#8249;</a>
    <div class="htitle">
      <img class="logo-img" src="logo-k-dreams-header.png" alt="K-Dreams">
      <div class="sub">Espace cigare</div>
    </div>
  </header>
  
  <div id="menu"></div>
</div>

<button class="cartbtn" id="cartBtn" onclick="openCart()">&#128722; <span id="cartCount">0</span> · <span id="cartTotal">0 FCFA</span></button>
<div class="sheet-bg" id="sheetBg" onclick="closeAll()"></div>
<div class="sheet" id="cartSheet">
  <h3>Ma commande</h3>
  <div id="cartLines"></div>
  <div class="cust">
    <input id="custName" type="text" placeholder="Nom pour la commande et la facture *" maxlength="40" autocomplete="off">
    <input id="custPhone" type="tel" inputmode="tel" placeholder="Téléphone (facultatif)" maxlength="20" autocomplete="off">
  </div>
  <div class="cerr" id="custErr"></div>
  <div class="total"><span>Total</span><span id="cartTotal2">0 FCFA</span></div>
  <button class="paybtn gold" onclick="openPay()" id="toPayBtn">Choisir le mode de paiement</button>
</div>
<div class="sheet" id="paySheet">
  <h3>Mode de paiement</h3>
  <button class="paybtn" onclick="pay('mtn')">MTN MoMo</button>
  <button class="paybtn" onclick="pay('orange')">Orange Money</button>
  <button class="paybtn" onclick="pay('terminal')">Terminal (carte bancaire)</button>
  <button class="paybtn" onclick="pay('especes')">Espèces</button>
</div>
<div class="sheet" id="confirmSheet">
  <div class="confirm">
    <div class="big">Commande enregistrée</div>
    <div id="confirmMsg" style="color:var(--muted);font-size:13px;line-height:1.5;"></div>
  </div>
  <button class="paybtn gold" onclick="closeAll()">Fermer</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAMbijp8xA3BLbaulDxZRzSh_jBNI8cqK8",
  authDomain: "omba-p-lounge.firebaseapp.com",
  projectId: "omba-p-lounge",
  storageBucket: "omba-p-lounge.firebasestorage.app",
  messagingSenderId: "469786469177",
  appId: "1:469786469177:web:614e9c606f58ba79e6bee8"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const ESPACE = {"main": "espace_cigare"};
const TABLE = parseInt(new URLSearchParams(location.search).get('table')) || null;
const DATA = {"main": [{"c": "Whisky", "i": [["Black Label 75cl", 45000, "", null], ["Blue Label", null, "", null], ["Chivas Regal 12 ans", 40000, "", null], ["Chivas 18 ans", 230000, "", null], ["Bellevoye Bleu", 40000, "", null], ["Gold Label", 90000, "", null], ["Jack Daniel's", 50000, "", null], ["Jack Daniel's Fire", 70000, "", null], ["Jack Daniel's Honey", 40000, "", null], ["Singleton 12 ans 75cl", 40000, "", null], ["Jack Daniel's Apple", 40000, "", null], ["Jameson Barrel", 45000, "", null], ["Red Label", 40000, "", null], ["Dewars 12 ans", 50000, "", null], ["Grants", 25000, "", null], ["Ballantines FI et Bra", 40000, "", null], ["Glemorangie 12 ans", 50000, "", null], ["Fragin", 25000, "", null], ["Roze", 70000, "", null], ["Bache", 50000, "", null], ["Monkey Shouter", 50000, "", null], ["Camus", 45000, "", null], ["Naud VS", 50000, "", null], ["Naud", 50000, "", null], ["Jack Honey 1L", 55000, "", null]]}, {"c": "Softs", "i": [["Supermont GM", 1000, "", null], ["Heineken", 2000, "", null], ["Guinness PM", 1500, "", null], ["Ice Black", 1500, "", null], ["Malta Guinness", 1500, "", null], ["Schweppes PM", 1000, "", null], ["Bavaria", 2000, "", null], ["Budweiser", 1500, "", null], ["Reactor", 1000, "", null], ["Red Bull", 2000, "", null], ["Skoll", 2000, "", null], ["Coca Cola GM", 1500, "", null], ["Schweppes GM", 1500, "", null], ["VK", 1500, "", null], ["Frustas", 2500, "", null]]}, {"c": "A ajouter (notes manuscrites en bas de fiche, sans prix)", "i": [["Vodka Absolut", null, "", null], ["Martell", null, "", null], ["Dark Blue", null, "", null]]}, {"c": "Cigares & Cigarettes", "i": [["Schimme/Pennick", 5000, "", null], ["D-Cartes", 15000, "", null], ["H-Upmann Habana Cuba", 25000, "", null], ["Montecristo", 5000, "", null], ["La Estrella", 40000, "", null], ["El Viejo PM", 20000, "", null], ["El Viejo GM", 30000, "", null], ["El Circus", 35000, "", null], ["Guantana", 30000, "", null], ["Romeo et Juliette", 30000, "", null], ["Partagas", 30000, "", null], ["La Flore Olivia", 15000, "", null], ["Cigare Electronic", 5000, "", null]]}, {"c": "Cigarettes Electroniques", "i": [["15000 puffs", 20000, "", null], ["12000 puffs", 15000, "", null], ["3500 puffs", 10000, "", null], ["Up Bar 500 puffs", 5000, "", null], ["Cigare K-Dream", 10000, "", null]]}, {"c": "Liqueurs", "i": [["Bailey's", 25000, "", null], ["Hennessy VS", 50000, "", null], ["Martini Blanc et Rouge", 25000, "", null], ["Belvedere", 50000, "", null]]}, {"c": "Vins Rouges", "i": [["Côte des Roses", 30000, "", null], ["Gustave", 20000, "", null], ["Haut Medoc de Giscours", 35000, "", null], ["Mont Meyrac", 10000, "", null], ["Vin Blanc Maria", 10000, "", null], ["Grant Versant", 10000, "", null], ["Isabelle de France", 10000, "", null], ["La Magistère", 25000, "", null], ["Karam", 20000, "", null]]}, {"c": "Champagne & Vins Mousseux", "i": [["Moet et Chandon Rosé", 50000, "", null], ["Moet Impérial Brut", 50000, "", null], ["Moet Impérial Nectar", 50000, "", null], ["Moscato", 75000, "", null], ["Ruinart Brut", 20000, "", null], ["Ruinart Rosé", 80000, "", null], ["Veuve Clicquot", 90000, "", null], ["Belaire Rose", 75000, "", null], ["Veuve Clicquot Rich", 50000, "", null], ["Maison Castel", 80000, "", null], ["Dom Pérignon Rose", 15000, "", null], ["Armand de Brignac", 250000, "", null]]}]};
const PAY = {"main": {"mtn": {"type": "perso", "val": "683088757"}, "orange": {"type": "perso", "val": "657490407"}}};
let ctx = "main";
let cart = {};

function fmt(n){ return n.toLocaleString('fr-FR') + ' FCFA'; }

function render(){
  const el = document.getElementById('menu');
  el.innerHTML = '';
  DATA[ctx].forEach(cat=>{
    const h = document.createElement('h2'); h.className='cat'; h.textContent = cat.c; el.appendChild(h);
    if(cat.n){ const nn=document.createElement('div'); nn.className='catnote'; nn.textContent=cat.n; el.appendChild(nn); }
    cat.i.forEach((it,idx)=>{
      const [nom, prix, ing, label] = it;
      const key = ctx+'|'+cat.c+'|'+nom;
      const row = document.createElement('div'); row.className='item';
      const info = document.createElement('div'); info.className='info';
      const n = document.createElement('div'); n.className='nom'; n.textContent = nom; info.appendChild(n);
      if(ing){ const i2=document.createElement('div'); i2.className='ing'; i2.textContent=ing; info.appendChild(i2); }
      const p = document.createElement('div'); p.className = 'prix' + (prix===null && !label ? ' na':'');
      p.textContent = label ? label : (prix===null ? 'Voir à la caisse' : fmt(prix));
      info.appendChild(p);
      row.appendChild(info);
      const qty = document.createElement('div'); qty.className='qty';
      const qv = cart[key] ? cart[key].q : 0;
      const bm = document.createElement('button'); bm.textContent = '−'; bm.onclick = ()=>chg(key,-1,nom,prix);
      const sp = document.createElement('span'); sp.textContent = qv;
      const bp = document.createElement('button'); bp.className = 'plus'; bp.textContent = '+'; bp.onclick = ()=>chg(key,1,nom,prix);
      qty.appendChild(bm); qty.appendChild(sp); qty.appendChild(bp);
      row.appendChild(qty);
      el.appendChild(row);
    });
  });
}

function chg(key, d, nom, prix){
  if(!cart[key]) cart[key] = {q:0, nom, prix};
  cart[key].q += d;
  if(cart[key].q <= 0) delete cart[key];
  updateCart();
  render();
}

function updateCart(){
  let count=0, total=0;
  Object.values(cart).forEach(c=>{ count+=c.q; total += (c.prix||0)*c.q; });
  document.getElementById('cartCount').textContent = count;
  document.getElementById('cartTotal').textContent = fmt(total);
  document.getElementById('cartTotal2').textContent = fmt(total);
  document.getElementById('cartBtn').classList.toggle('show', count>0);
  const lines = document.getElementById('cartLines');
  lines.innerHTML='';
  if(count===0){ lines.innerHTML = '<div class="empty">Votre panier est vide</div>'; }
  Object.entries(cart).forEach(([key,c])=>{
    const d = document.createElement('div'); d.className='cline';
    const cn = document.createElement('div'); cn.className='cn'; cn.textContent = c.nom + ' ×' + c.q;
    const cp = document.createElement('div'); cp.className='cp'; cp.textContent = c.prix ? fmt(c.prix*c.q) : '—';
    const rm = document.createElement('button'); rm.className='rm'; rm.textContent='✕'; rm.onclick = ()=>removeLine(key);
    d.appendChild(cn); d.appendChild(cp); d.appendChild(rm);
    lines.appendChild(d);
  });
}
function removeLine(key){ delete cart[key]; updateCart(); render(); }

function openCart(){ closeAll(); document.getElementById('sheetBg').classList.add('show'); document.getElementById('cartSheet').classList.add('show'); }
function openPay(){
  const nm = document.getElementById('custName').value.trim();
  if(nm.length < 2){
    document.getElementById('custErr').textContent = 'Indiquez le nom à mettre sur la commande.';
    document.getElementById('custName').focus();
    return;
  }
  document.getElementById('custErr').textContent = '';
  document.getElementById('cartSheet').classList.remove('show');
  document.getElementById('paySheet').classList.add('show');
}
function closeAll(){ ['sheetBg','cartSheet','paySheet','confirmSheet'].forEach(id=>document.getElementById(id).classList.remove('show')); }

function total(){ let t=0; Object.values(cart).forEach(c=>t+=(c.prix||0)*c.q); return t; }

function dialCode(mode){
  const cfg = PAY[ctx][mode];
  const amt = total();
  if(mode==='mtn'){
    return cfg.type==='marchand' ? `*126*4*${cfg.val}*${amt}#` : `*126*1*${cfg.val}*${amt}#`;
  }
  if(mode==='orange'){
    return cfg.type==='marchand' ? `#150*47*${cfg.val}*${amt}#` : `#150*14*${amt}*${cfg.val}#`;
  }
  return '';
}

async function pay(mode){
  if(Object.keys(cart).length===0){ return; }
  const msg = document.getElementById('confirmMsg');
  const items = Object.values(cart).map(c=>({nom:c.nom, q:c.q, prix:(c.prix===null||c.prix===undefined)?null:c.prix}));
  const order = {
    etablissement:'kdreams', espace: ESPACE[ctx], table: TABLE, items: items,
    customerName: document.getElementById('custName').value.trim(), customerPhone: document.getElementById('custPhone').value.trim(),
    total: total(), hasUnpriced: items.some(i=>i.prix===null),
    payMode: mode, status:'en_attente',
    createdAt: firebase.firestore.FieldValue.serverTimestamp(), createdMs: Date.now()
  };
  try{
    await db.collection('kdreams_orders').add(order);
  }catch(e){
    document.getElementById('paySheet').classList.remove('show');
    document.getElementById('confirmSheet').classList.add('show');
    msg.textContent = "Impossible d'envoyer la commande (connexion). Réessayez ou présentez-vous à la caisse.";
    return;
  }
  document.getElementById('paySheet').classList.remove('show');
  document.getElementById('confirmSheet').classList.add('show');
  const amt = fmt(total());
  if(mode==='mtn' || mode==='orange'){
    const code = dialCode(mode);
    msg.textContent = 'Commande envoyée à la caisse. Composez ' + code + ' pour régler ' + amt + '.';
    const tel = 'tel:' + code.replace(/#/g,'%23');
    setTimeout(()=>{ window.location.href = tel; }, 400);
  } else if(mode==='terminal'){
    msg.textContent = 'Commande envoyée à la caisse. Réglez ' + amt + ' par carte auprès du personnel.';
  } else {
    msg.textContent = 'Commande envoyée à la caisse. Réglez ' + amt + ' en espèces auprès du personnel.';
  }
  cart = {};
  document.getElementById('custName').value = '';
  document.getElementById('custPhone').value = '';
  updateCart();
  render();
}



if(TABLE){ document.querySelector('.sub').textContent += ' · Table ' + TABLE; }
if(typeof switchTab==='function' && DATA.rooftop && TABLE>=21 && TABLE<=40){ switchTab('rooftop'); }
render();
updateCart();
</script>
</body>
</html>
